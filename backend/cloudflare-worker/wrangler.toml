# AI-CT TEACHER backend — Cloudflare Worker (Gemini only).
# Deploy FROM THIS FOLDER (use Command Prompt "cmd"):   npx wrangler deploy
#
# `name` is the Worker the website uses:  https://ai-ct-teacher-ai.<your-subdomain>.workers.dev
# The Gemini key is a secret (never in this file) and belongs to THIS Worker:   npx wrangler secret put GEMINI_API_KEY

name = "ai-ct-teacher-ai"
main = "worker.js"
compatibility_date = "2024-09-01"

# Keep variables you set in the Cloudflare dashboard (for example GEMINI_MODEL) when you deploy.
keep_vars = true

# Optional non-secret override of the model name:
# [vars]
# GEMINI_MODEL = "gemini-3.8-flash"
